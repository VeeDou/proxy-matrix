[Proxy Group]
# Built-in Service Groups
AI Services = select, policy-regex-filter=(?:美国|US|USA|日本|JP|新加坡|SG)
Google Services = select, policy-regex-filter=(?:美国|US|USA|日本|JP|香港|HK)
Streaming Media = select, policy-regex-filter=(?:香港|HK|台湾|TW|日本|JP|新加坡|SG)

# Dynamic Region Groups
Hong Kong = select, policy-regex-filter=(?:香港|(?<![A-Za-z])HK(?![A-Za-z])|Hong ?Kong|HKT|HKBN)
Japan = select, policy-regex-filter=(?:日本|(?<![A-Za-z])JP(?![A-Za-z])|Japan|Tokyo|Osaka|东京|大阪)
United States = select, policy-regex-filter=(?:美国|(?<![A-Za-z])(?:US|USA|LA)(?![A-Za-z])|United ?States|Los ?Angeles|Silicon ?Valley|西雅图|纽约)
Singapore = select, policy-regex-filter=(?:新加坡|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|狮城)
Taiwan = select, policy-regex-filter=(?:台湾|(?<![A-Za-z])TW(?![A-Za-z])|Taiwan|Taipei|台北|新北|台中)
Korea = select, policy-regex-filter=(?:韩国|(?<![A-Za-z])KR(?![A-Za-z])|Korea|Seoul|首尔)
United Kingdom = select, policy-regex-filter=(?:英国|(?<![A-Za-z])UK(?![A-Za-z])|United ?Kingdom|London|伦敦)
Germany = select, policy-regex-filter=(?:德国|(?<![A-Za-z])DE(?![A-Za-z])|Germany|Frankfurt|法兰克福)
