# proxy-matrix-managed: v1
# managed-by-proxy-matrix
mode: "rule"
ipv6: false
"log-level": "info"
"tcp-concurrent": true
profile:
  "store-selected": true
  "store-fake-ip": true
dns:
  enable: true
  ipv6: false
  "default-nameserver":
    - "223.5.5.5"
    - "119.29.29.29"
  "enhanced-mode": "fake-ip"
  "fake-ip-range": "198.18.0.1/16"
  "use-hosts": true
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  fallback:
    - "https://dns.cloudflare.com/dns-query"
    - "https://dns.google/dns-query"
  "fallback-filter":
    geoip: true
    "geoip-code": "CN"
    ipcidr:
      - "240.0.0.0/4"
  "nameserver-policy":
    "+.google.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.googleapis.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.googleapis.cn": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.googlevideo.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.gstatic.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.gmail.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.googlemail.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.youtube.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.youtu.be": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.ytimg.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.ggpht.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.google": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.goog": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.google.dev": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.googleusercontent.com": "https://1.1.1.1/dns-query#🌐 谷歌服务"
    "+.openai.com": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.chatgpt.com": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.oaistatic.com": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.oaiusercontent.com": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.anthropic.com": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.claude.ai": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.perplexity.ai": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
    "+.x.ai": "https://dns.cloudflare.com/dns-query#🤖 AI 服务"
