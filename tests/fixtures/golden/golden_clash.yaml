"proxy-providers":
  主力机场:
    type: "http"
    url: "https://airport-a.example.com/api/v1/client/subscribe?token=EXAMPLE_TOKEN_AAA"
    interval: 86400
    path: "./profiles/主力机场.yaml"
    "health-check":
      enable: true
      url: "http://cp.cloudflare.com/generate_204"
      interval: 300
  备用机场:
    type: "http"
    url: "https://airport-b.example.com/api/v1/client/subscribe?token=EXAMPLE_TOKEN_BBB"
    interval: 86400
    path: "./profiles/备用机场.yaml"
    "health-check":
      enable: true
      url: "http://cp.cloudflare.com/generate_204"
      interval: 300
"proxy-groups":
  -
    name: "🚀 节点选择"
    type: "select"
    proxies:
      - "⚡️ 自动优选"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇸🇬 新加坡节点"
      - "🇹🇼 台湾节点"
      - "DIRECT"
  -
    name: "⚡️ 自动优选"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    use:
      - "主力机场"
      - "备用机场"
    "empty-fallback": "REJECT"
  -
    name: "🤖 AI 服务"
    type: "select"
    proxies:
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🚀 节点选择"
  -
    name: "🌐 谷歌服务"
    type: "select"
    proxies:
      - "🤖 AI 服务"
      - "🇺🇸 美国节点"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🚀 节点选择"
  -
    name: "🎬 国际流媒体"
    type: "select"
    proxies:
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🚀 节点选择"
  -
    name: "🇭🇰 香港节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:香港|HK|Hong ?Kong|HKT|HKBN)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇯🇵 日本节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:日本|JP|Japan|Tokyo|Osaka|东京|大阪)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇺🇸 美国节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:美国|US|USA|United ?States|LA|Los ?Angeles|Silicon ?Valley|西雅图|纽约)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇸🇬 新加坡节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:新加坡|SG|Singapore|狮城)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇹🇼 台湾节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:台湾|TW|Taiwan|Taipei|台北|新北|台中)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇰🇷 韩国节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:韩国|KR|Korea|Seoul|首尔)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇬🇧 英国节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:英国|UK|United ?Kingdom|London|伦敦)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
  -
    name: "🇩🇪 德国节点"
    type: "url-test"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    filter: "(?:德国|DE|Germany|Frankfurt|法兰克福)"
    "empty-fallback": "REJECT"
    use:
      - "主力机场"
      - "备用机场"
